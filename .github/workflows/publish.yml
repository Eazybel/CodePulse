name: CI and Marketplace release

# Publishes to the VS Code Marketplace when a version tag such as v1.0.4 is pushed.
# The tag must match the "version" in package.json. Requires the VSCE_PAT repository
# secret (an Azure DevOps personal access token with Marketplace "Manage" scope).

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this version to the Visual Studio Marketplace
        required: true
        default: false
        type: boolean

permissions:
  contents: read

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read extension version
        id: version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + require('./package.json').version + '\n')"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx @vscode/vsce package --out "artifacts/codepulse-tracker-${{ steps.version.outputs.value }}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-tracker-${{ steps.version.outputs.value }}
          path: artifacts/codepulse-tracker-${{ steps.version.outputs.value }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/tags/v{0}', needs.validate.outputs.version)) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish with Marketplace Trusted Publishing
        run: npx @vscode/vsce publish --oidc
