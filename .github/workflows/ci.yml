name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test

      - name: Package extension (verifies the VSIX builds)
        run: npx @vscode/vsce package --out ./codepulse-tracker-ci.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-tracker-vsix
          path: codepulse-tracker-ci.vsix
          if-no-files-found: error
